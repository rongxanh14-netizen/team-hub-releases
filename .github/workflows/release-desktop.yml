name: Build and release Team Hub macOS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: team-hub-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract reviewed source
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          data = open('team-hub-source.zip','rb').read()
          assert hashlib.sha256(data).hexdigest() == 'a04734d059770c830941e0d1b5aacd416bbc670dee1dbc787bc5891f99d5b965'
          zipfile.ZipFile('team-hub-source.zip').extractall('app')
          PY
      - run: npm ci
        working-directory: app
      - name: Test authentication and storage
        working-directory: app
        run: node --test mac-keychain.test.js session-restore.test.js account-auth.test.js credential-crypto.test.js remember-login.test.js login-ui.test.js desktop-server.test.js
      - name: Build macOS universal
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          sips -z 512 512 desktop/assets/icon.png --out desktop/assets/icon.png
          npm run dist:mac
      - name: Verify packaged fix
        run: |
          test -f outputs/team-hub-desktop/Team-Hub-1.5.6-macOS-universal.dmg
          test -f outputs/team-hub-desktop/Team-Hub-1.5.6-macOS-universal.zip
          test -f outputs/team-hub-desktop/latest-mac.yml
          node - <<'JS'
          const asar=require('./app/node_modules/@electron/asar');
          const file='outputs/team-hub-desktop/mac-universal/Team Hub.app/Contents/Resources/app.asar';
          const p=JSON.parse(asar.extractFile(file,'package.json'));
          if(p.version!=='1.5.6'||p.localPreview)throw Error('Wrong package');
          if(!asar.extractFile(file,'desktop/mac-keychain.cjs').toString().includes('THK2'))throw Error('Missing fix');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macOS
          if-no-files-found: error
          path: |
            outputs/team-hub-desktop/*.dmg
            outputs/team-hub-desktop/*.zip
            outputs/team-hub-desktop/*.blockmap
            outputs/team-hub-desktop/latest-mac.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Preserve current Windows update channel and publish macOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.5.4 -p 'latest.yml' -p 'Team-Hub-Setup-1.5.4.exe' -p 'Team-Hub-Setup-1.5.4.exe.blockmap' -D release-assets
          cp team-hub-source.zip release-assets/Team-Hub-Source-1.5.6.zip
          test -f release-assets/latest-mac.yml
          test -f release-assets/latest.yml
          gh release create v1.5.6 --draft --target "$GITHUB_SHA" --title "Team Hub 1.5.6 — macOS: Ghi nhớ không giới hạn" --notes-file release-notes.md
          gh release upload v1.5.6 release-assets/*
          gh release edit v1.5.6 --draft=false --latest

